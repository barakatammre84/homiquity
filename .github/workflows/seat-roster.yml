# Checks repository records only. Actual scheduler registration requires a live application read.
name: Task instruction routing


on:
  schedule:
    - cron: "0 9 * * 1" # Mondays, 09:00 UTC — same slot as the doc-freshness sweep
  workflow_dispatch:

jobs:
  roster:
    name: task instruction routing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Task definition routing (scheduler state is not inferred)
        run: node scripts/seat-roster-guard.cjs
